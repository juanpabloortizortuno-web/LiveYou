<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveYou · videos cortos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{--bg:#0b0a12;--panel:#14121f;--line:#2a2740;--text:#f3f1fa;--muted:#9a96b5;--pink:#ff3d6e;--violet:#5b1f9e;--teal:#2fe3c2}
  *{box-sizing:border-box;margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  button,input,textarea{font:inherit}
  .hidden{display:none!important}

  /* LOGIN */
  .login{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
  .hero{background:linear-gradient(135deg,var(--pink),var(--violet));padding:12vh 8%;display:flex;flex-direction:column;justify-content:center;gap:16px}
  .logo{font-size:2rem;font-weight:700;letter-spacing:-.5px}.logo i{color:var(--teal);font-style:normal}
  .hero h1{font-size:clamp(2rem,4vw,3.2rem);line-height:1.1}
  .hero p{opacity:.85}
  .box{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:8%;max-width:480px;margin:auto;width:100%}
  .box h2{font-size:1.2rem}.box small{color:var(--muted)}
  .btn{border:0;border-radius:999px;padding:14px 20px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
  .btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .btn.white{background:#fff;color:#111}
  .btn.main{background:var(--pink);color:#fff}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .btn:disabled{opacity:.5;cursor:wait}
  .sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
  .sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
  input,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text)}
  textarea{resize:vertical;min-height:80px}
  label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 6px}
  .msg{font-size:.9rem;min-height:1.2em}.msg.err{color:#ff7b8f}.msg.ok{color:var(--teal)}

  /* APP */
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 5%;border-bottom:1px solid var(--line)}
  header .who{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--text);cursor:pointer}
  .av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--line)}
  main{max-width:640px;margin:0 auto;padding:28px 5%}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .cover{height:130px;background:linear-gradient(135deg,var(--pink),var(--violet))}
  .info{padding:0 24px 24px}
  .big{width:96px;height:96px;border-radius:50%;border:4px solid var(--panel);margin-top:-48px;object-fit:cover;background:var(--line);display:block}
  .info h3{margin-top:10px;font-size:1.4rem}
  .user{color:var(--muted)}.bio{margin-top:10px;color:#d6d3e8;white-space:pre-wrap}
  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .actions .btn{padding:10px 18px}
  .feed{margin-top:24px;padding:36px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}

  @media(max-width:760px){.login{grid-template-columns:1fr}.hero{padding:8vh 8%}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ========== LOGIN ========== -->
<section id="login" class="login hidden">
  <div class="hero">
    <div class="logo">LiveYou<i>.</i></div>
    <h1>Crea, mira y transmite videos cortos en vivo</h1>
    <p>Tu comunidad, tu cámara, tu momento.</p>
  </div>
  <div class="box">
    <h2>Iniciar sesión</h2>
    <small>Entra con Google o con tu correo. Tus videos, me gusta y guardados quedan en tu cuenta.</small>
    <button class="btn white" id="btnGoogle">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Continuar con Google
    </button>
    <div class="sep">o con tu correo</div>
    <input id="email" type="email" placeholder="Correo electrónico" autocomplete="email">
    <button class="btn main" id="btnEmail">Enviarme un enlace de acceso</button>
    <p class="msg" id="loginMsg" role="status"></p>
  </div>
</section>

<!-- ========== APP ========== -->
<section id="app" class="hidden">
  <header>
    <div class="logo">LiveYou<i>.</i></div>
    <button class="who" id="btnWho"><span id="hName"></span><img class="av" id="hAvatar" alt="Tu foto"></button>
  </header>
  <main>
    <div class="card">
      <div class="cover"></div>
      <div class="info" id="view">
        <img class="big" id="pAvatar" alt="Foto de perfil">
        <h3 id="pName"></h3>
        <div class="user" id="pUser"></div>
        <p class="bio" id="pBio"></p>
        <div class="actions">
          <button class="btn main" id="btnEdit">Editar perfil</button>
          <button class="btn ghost" id="btnLogout">Cerrar sesión</button>
        </div>
      </div>
      <form class="info hidden" id="editForm">
        <img class="big" id="eAvatar" alt="Foto de perfil">
        <label for="fName">Nombre</label><input id="fName" maxlength="50">
        <label for="fUser">Usuario</label><input id="fUser" maxlength="30" pattern="[a-zA-Z0-9_.]{3,30}" title="3 a 30 letras, números, punto o guion bajo">
        <label for="fBio">Biografía</label><textarea id="fBio" maxlength="200"></textarea>
        <label for="fFile">Cambiar foto (opcional)</label><input id="fFile" type="file" accept="image/*">
        <p class="msg" id="editMsg" role="status"></p>
        <div class="actions">
          <button class="btn main" type="submit" id="btnSave">Guardar cambios</button>
          <button class="btn ghost" type="button" id="btnCancel">Cancelar</button>
        </div>
      </form>
    </div>
    <div class="feed">Aún no hay videos. Aquí aparecerá tu contenido.</div>
  </main>
</section>

<script>
/* ========== CONFIGURACIÓN: pega tu anon key ========== */
const SUPABASE_URL = "https://cmnnskdmkgtyeluzsvvj.supabase.co";
const SUPABASE_KEY = "PEGA_AQUI_TU_ANON_PUBLIC_KEY";
const SITE_URL     = "https://juanpabloortizortuno-web.github.io/LiveYou/";
/* ===================================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let me = null, profile = null;

function say(el, text, type){ el.textContent = text; el.className = "msg " + (type||""); }
const fallbackAvatar = n => "https://ui-avatars.com/api/?background=ff3d6e&color=fff&size=200&name=" + encodeURIComponent(n||"U");

/* ---------- Login ---------- */
$("btnGoogle").onclick = async () => {
  const { error } = await sb.auth.signInWithOAuth({ provider:"google", options:{ redirectTo: SITE_URL } });
  if (error) say($("loginMsg"), "No se pudo iniciar con Google: " + error.message, "err");
};
$("btnEmail").onclick = async () => {
  const email = $("email").value.trim();
  if (!email) return say($("loginMsg"), "Escribe tu correo.", "err");
  $("btnEmail").disabled = true;
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: SITE_URL } });
  $("btnEmail").disabled = false;
  error ? say($("loginMsg"), error.message, "err")
        : say($("loginMsg"), "Listo. Revisa tu correo y abre el enlace.", "ok");
};
$("btnLogout").onclick = async () => { await sb.auth.signOut(); };

/* ---------- Perfil ---------- */
async function loadProfile(user){
  let { data } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  const m = user.user_metadata || {};
  if (!data) { // respaldo si el trigger no creó el perfil
    const base = {
      id: user.id,
      username: (user.email||"user").split("@")[0].replace(/[^a-zA-Z0-9_.]/g,"") + Math.floor(Math.random()*1000),
      full_name: m.full_name || m.name || "",
      avatar_url: m.avatar_url || m.picture || ""
    };
    const r = await sb.from("profiles").insert(base).select().single();
    data = r.data || base;
  }
  // si aún no tiene foto, usa la de Google
  if (!data.avatar_url && (m.avatar_url || m.picture)) {
    data.avatar_url = m.avatar_url || m.picture;
    sb.from("profiles").update({ avatar_url: data.avatar_url }).eq("id", user.id);
  }
  return data;
}

function paint(){
  const name = profile.full_name || profile.username || "Usuario";
  const pic = profile.avatar_url || fallbackAvatar(name);
  $("hName").textContent = name.split(" ")[0];
  $("hAvatar").src = pic; $("pAvatar").src = pic; $("eAvatar").src = pic;
  $("pName").textContent = name;
  $("pUser").textContent = "@" + (profile.username || "");
  $("pBio").textContent = profile.bio || "Añade una biografía para que te conozcan.";
}

function openEdit(show){
  $("view").classList.toggle("hidden", show);
  $("editForm").classList.toggle("hidden", !show);
  if (show){
    $("fName").value = profile.full_name || "";
    $("fUser").value = profile.username || "";
    $("fBio").value = profile.bio || "";
    $("fFile").value = ""; say($("editMsg"), "");
  }
}
$("btnEdit").onclick = $("btnWho").onclick = () => openEdit(true);
$("btnCancel").onclick = () => openEdit(false);

$("editForm").onsubmit = async e => {
  e.preventDefault();
  $("btnSave").disabled = true; say($("editMsg"), "Guardando…");
  let avatar_url = profile.avatar_url;
  const file = $("fFile").files[0];
  if (file){
    if (file.size > 3*1024*1024){ $("btnSave").disabled=false; return say($("editMsg"), "La foto debe pesar menos de 3 MB.", "err"); }
    const path = me.id + "/avatar-" + Date.now() + "." + file.name.split(".").pop();
    const up = await sb.storage.from("avatars").upload(path, file, { upsert:true });
    if (up.error){ $("btnSave").disabled=false; return say($("editMsg"), "No se pudo subir la foto: " + up.error.message, "err"); }
    avatar_url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
  }
  const changes = { full_name: $("fName").value.trim(), username: $("fUser").value.trim(), bio: $("fBio").value.trim(), avatar_url };
  const { error } = await sb.from("profiles").update(changes).eq("id", me.id);
  $("btnSave").disabled = false;
  if (error) return say($("editMsg"), error.code === "23505" ? "Ese usuario ya está en uso." : error.message, "err");
  profile = { ...profile, ...changes };
  paint(); openEdit(false);
};

/* ---------- Estado de sesión ---------- */
async function route(session){
  if (!session){
    me = profile = null;
    $("app").classList.add("hidden"); $("login").classList.remove("hidden");
    return;
  }
  me = session.user;
  profile = await loadProfile(me);
  paint(); openEdit(false);
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  if (location.hash.includes("access_token")) history.replaceState(null, "", location.pathname);
}
sb.auth.onAuthStateChange((_evt, session) => { setTimeout(() => route(session), 0); });
sb.auth.getSession().then(({ data }) => route(data.session));
</script>
</body>
</html>
